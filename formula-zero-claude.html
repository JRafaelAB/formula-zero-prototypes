border:2px solid #d9d6d0;border-radius:30px;padding:9px 18px;font:600 14px 'Titillium Web';min-width:240px;background:#fff}\n.search:focus{outline:none;border-color:var(--red)}\n\n/* Driver grid (formula1.com/drivers style) */\n.driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}\n.dcard{border-radius:14px;overflow:hidden;color:#fff;position:relative;min-height:330px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;transition:.25s}\n.dcard:hover{transform:translateY(-4px);box-shadow:0 24px 40px -22px rgba(0,0,0,.6)}\n.dcard::before{content:\"\";position:absolute;inset:0;background:linear-gradient(200deg,transparent 35%,rgba(0,0,0,.55))}\n.dcard>*{position:relative}\n.dcard .num{position:absolute;right:14px;top:4px;font-size:130px;font-weight:900;font-style:italic;line-height:1;opacity:.22}\n.dcard .pos{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}\n.dcard .first{font-size:18px}\n.dcard .last{font-size:32px;font-weight:900;text-transform:uppercase;line-height:1}\n.dcard .team{font-size:13px;font-weight:600;opacity:.9;margin-top:6px}\n.dcard .avatar{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:40px;font-weight:900;border:3px solid rgba(255,255,255,.45)}\n.dcard .pts{position:absolute;right:22px;bottom:22px;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:20px;font-weight:900}\n\n/* Driver profile */\n.profile-hero{color:#fff;position:relative;overflow:hidden}\n.profile-hero::after{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 70%)}\n.profile-hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr auto;gap:40px;align-items:center;padding-top:56px;padding-bottom:56px}\n.profile-hero .avatar{width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.2);border:4px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:64px;font-weight:900}\n.profile-hero h1{font-size:clamp(44px,6vw,84px);text-transform:uppercase;font-style:italic}\n.profile-hero .first{font-size:28px;font-weight:300}\n.profile-hero .bignum{font-size:180px;font-weight:900;font-style:italic;opacity:.3;line-height:.8}\n.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}\n.kv div{background:#fff;border-radius:12px;padding:20px;border-left:4px solid var(--red)}\n.kv span{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-light)}\n.kv strong{font-size:30px;font-weight:900;font-style:italic}\n\n/* Light data table (F1 results style) */\n.dtable{width:100%;border-collapse:collapse;background:#fff;font-size:15px}\n.dtable th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-light);padding:14px 18px;background:#fafaf8;border-bottom:1px solid #e3e1dc;white-space:nowrap}\n.dtable td{padding:14px 18px;border-bottom:1px solid #eeece8;font-weight:600}\n.dtable tr:hover td{background:#fbfaf8}\n.dtable td.pos{font-weight:900;font-style:italic;font-size:18px;width:60px}\n.dtable td.pts,.dtable th.r{font-weight:900;text-align:right}\n.dtable .teamdot{display:inline-block;width:5px;height:22px;border-radius:2px;vertical-align:middle;margin-right:12px}\n.dtable .sub{color:var(--gray-light);font-weight:600;font-size:13px}\n.table-scroll{overflow-x:auto;border-radius:12px;background:#fff}\n.bigtabs{display:flex;border-bottom:2px solid #e3e1dc;margin-bottom:28px;overflow-x:auto}\n.bigtabs button{background:none;border:0;font:900 20px 'Titillium Web';font-style:italic;text-transform:uppercase;padding:14px 24px;cursor:pointer;color:var(--gray-light);position:relative;white-space:nowrap}\n.bigtabs button.on{color:var(--carbon)}\n.bigtabs button.on::after{content:\"\";position:absolute;left:0;right:0;bottom:-2px;height:4px;background:var(--red)}\n.gap-bar{height:6px;border-radius:3px;background:#eeece8;width:120px;overflow:hidden}\n.gap-bar i{display:block;height:100%;background:var(--red)}\n\n/* Team cards (formula1.com/teams style) */\n.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}\n.tcard{border-radius:14px;color:#fff;padding:26px;position:relative;overflow:hidden;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;transition:.25s}\n.tcard:hover{transform:translateY(-4px)}\n.tcard::before{content:\"\";position:absolute;right:-40px;top:0;bottom:0;width:220px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 22px,transparent 22px 40px);transform:skewX(-24deg)}\n.tcard>*{position:relative}\n.tcard .top{display:flex;justify-content:space-between;align-items:start;gap:16px}\n.tcard h3{font-size:30px;font-style:italic;text-transform:uppercase}\n.tcard .rank{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-bottom:6px}\n.tcard .tpts{background:rgba(0,0,0,.3);border-radius:20px;padding:4px 14px;font-weight:900;font-size:18px;display:inline-block;margin-top:10px}\n.tcard .pair{display:flex;gap:24px;flex-wrap:wrap}\n.tcard .pair a{display:flex;gap:10px;align-items:center;font-weight:700}\n.tcard .pair a:hover{text-decoration:underline}\n.tcard .mini{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:900;font-size:15px;border:2px solid rgba(255,255,255,.45)}\n.tcard .badge{width:72px;height:72px;border-radius:14px;background:rgba(0,0,0,.25);display:grid;place-items:center;font-weight:900;font-style:italic;font-size:24px;flex-shrink:0}\n\n/* Calendar list */\n.round-row{display:grid;grid-template-columns:110px 1fr auto auto;gap:24px;align-items:center;background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:12px;border:1px solid #e3e1dc;transition:.2s}\n.round-row:hover{border-color:var(--carbon)}\n.round-row .d{font-weight:900;font-style:italic;font-size:26px;line-height:1}\n.round-row .d small{display:block;font-size:12px;font-style:normal;letter-spacing:.1em;color:var(--gray-light);font-weight:700;margin-bottom:4px}\n.round-row h4{font-size:20px}\n.round-row p{color:#5a5a62;font-size:14px}\n.round-row .podium{display:flex;gap:8px;flex-wrap:wrap}\n.round-row .podium span{font-size:13px;font-weight:700;background:var(--off);padding:4px 10px;border-radius:14px}\n.round-row .podium span:first-child{background:#fff0c2}\n.round-row.next{background:var(--red);color:#fff;border-color:var(--red)}\n.round-row.next .d small,.round-row.next p{color:rgba(255,255,255,.85)}\n.round-row.next .btn-ghost:hover{color:var(--red)}\n.round-row .btn{padding:10px 16px;font-size:12px}\n.btn-outline{border-color:var(--carbon);color:var(--carbon)}.btn-outline:hover{background:var(--carbon);color:#fff}\n.country{display:inline-block;font-size:11px;font-weight:900;background:var(--carbon);color:#fff;padding:2px 6px;border-radius:3px;margin-right:8px;vertical-align:middle;letter-spacing:.06em;font-style:normal}\n.round-row.next .country{background:#fff;color:var(--red)}\n\n/* Status pills */\n.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}\n.pill.pending{background:#fff3d6;color:#8a5a00}\n.pill.review{background:#e1ecff;color:#1d4fa3}\n.pill.penalty{background:#ffe1e0;color:var(--red-dark)}\n.pill.noaction{background:#eceae6;color:#5a5a62}\n\n/* Forms (stewards / complaints) */\n.two-col{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:start}\n.panel{background:#fff;border-radius:14px;padding:32px;border-top:4px solid var(--red)}\n.panel h2{font-size:28px;font-style:italic;text-transform:uppercase;margin-bottom:6px}\n.panel .hint{color:#5a5a62;margin-bottom:24px}\n.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n.field{display:flex;flex-direction:column;gap:6px}\n.field.full{grid-column:1/-1}\n.field label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5a5a62}\n.field input,.field select,.field textarea{font:600 15px 'Titillium Web';padding:12px 14px;border:2px solid #e3e1dc;border-radius:8px;background:#fafaf8;color:var(--carbon);width:100%}\n.field textarea{min-height:120px;resize:vertical}\n.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red);background:#fff}\n.dropzone{border:2px dashed #c9c6bf;border-radius:12px;padding:32px;text-align:center;background:#fafaf8;cursor:pointer;transition:.2s;display:block}\n.dropzone.drag,.dropzone:hover{border-color:var(--red);background:#fff5f5}\n.dropzone .ico{width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:26px;font-weight:900}\n.dropzone strong{display:block;font-size:17px}\n.dropzone small{color:var(--gray-light)}\n.files{list-style:none;margin-top:12px;display:grid;gap:8px}\n.files li{display:flex;justify-content:space-between;background:var(--off);border-radius:8px;padding:10px 14px;font-weight:600;font-size:14px}\n.files li button{background:none;border:0;color:var(--red);font-weight:900;cursor:pointer}\n.check{display:flex;gap:10px;align-items:start;font-size:14px;color:#5a5a62}\n.check input{margin-top:4px;accent-color:var(--red)}\n.complaint{background:#fff;border-radius:12px;padding:20px 22px;margin-bottom:12px;border:1px solid #e3e1dc}\n.complaint .top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}\n.complaint .id{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--gray-light)}\n.complaint h4{font-size:17px;font-weight:700}\n.complaint p{font-size:14px;color:#5a5a62;margin-top:6px}\n.complaint .verdict{margin-top:12px;padding:10px 14px;background:var(--off);border-radius:8px;font-size:14px;font-weight:600;border-left:3px solid var(--red)}\n.complaint .att{font-size:13px;font-weight:700;color:var(--red);margin-top:8px}\n.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,140px);background:var(--carbon);color:#fff;padding:14px 22px;border-radius:10px;font-weight:700;border-left:4px solid var(--red);transition:.35s;z-index:400}\n.toast.show{transform:translate(-50%,0)}\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}\n.steps div{background:#fff;border-radius:12px;padding:18px;border:1px solid #e3e1dc}\n.steps b{display:block;font-size:28px;font-weight:900;font-style:italic;color:var(--red);line-height:1}\n.steps span{font-weight:700}\n\n/* Birthdays */\n.bdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}\n.bday{background:#fff;border-radius:12px;padding:18px;display:flex;gap:14px;align-items:center;border:1px solid #e3e1dc}\n.bday .mini{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex-shrink:0}\n.bday b{display:block}.bday small{color:var(--gray-light);font-weight:600}\n.bday .in{margin-left:auto;font-weight:900;font-style:italic;font-size:24px;color:var(--red);text-align:right;line-height:1}\n.bday .in small{display:block;font-size:11px;font-style:normal;letter-spacing:.08em;text-transform:uppercase}\n\n/* Explore cards (Exodus feature) */\n.explore{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}\n.ex{background:var(--carbon);color:#fff;border-radius:12px;padding:24px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:.2s}\n.ex:hover{background:var(--red)}\n.ex h4{font-size:24px;font-style:italic;text-transform:uppercase;font-weight:900}\n.ex p{color:#c9c9cf;font-size:14px}.ex:hover p{color:#fff}\n.ex::after{content:\"→\";position:absolute;right:22px;top:20px;font-size:24px}\n\n/* Auth modal */\n.modal{position:fixed;inset:0;background:rgba(10,10,14,.7);backdrop-filter:blur(4px);display:none;place-items:center;z-index:300;padding:20px}\n.modal.open{display:grid}\n.modal .box{background:#fff;border-radius:16px;width:100%;max-width:440px;overflow:hidden}\n.modal .mh{background:var(--red);color:#fff;padding:20px 28px;display:flex;justify-content:space-between;align-items:center}\n.modal .mh svg{height:30px}\n.modal .mh button{background:none;border:0;color:#fff;font-size:30px;cursor:pointer;line-height:1}\n.modal .mb{padding:24px 28px 28px;display:grid;gap:16px}\n.modal .bigtabs{margin-bottom:0}.modal .bigtabs button{font-size:16px;padding:10px 16px}\n.btn-dark{background:var(--carbon);color:#fff;justify-content:center}.btn-dark:hover{background:#000}\n.btn-full{width:100%;justify-content:center}\n.or{text-align:center;color:var(--gray-light);font-size:13px;font-weight:700;letter-spacing:.1em}\n\n@media (max-width:1080px){\n  .two-col{grid-template-columns:minmax(0,1fr)}\n  .explore,.steps{grid-template-columns:1fr 1fr}\n  .profile-hero .wrap{grid-template-columns:auto 1fr}.profile-hero .bignum{display:none}\n  .team-grid{grid-template-columns:minmax(0,1fr)}\n  .round-row{grid-template-columns:90px 1fr}.round-row .podium,.round-row>.btn{grid-column:1/-1;justify-self:start}\n}\n@media (max-width:640px){\n  .explore,.form-grid,.steps{grid-template-columns:1fr}\n  .profile-hero .wrap{grid-template-columns:1fr}.profile-hero .avatar{width:120px;height:120px;font-size:44px}\n  .search{margin-left:0;width:100%;min-width:0}\n  .panel{padding:22px}\n  .page-head::before{width:160px;opacity:.5}\n}\n.field .check input,.check input{width:auto;flex-shrink:0}\n.field label.check{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;align-items:flex-start}\n.field label.dropzone{text-transform:none;letter-spacing:0;color:var(--carbon);font-size:15px}\n.dropzone strong{font-size:18px;font-weight:700}\n","site.js":"/* Formula Zero prototype: shared data + chrome (header, footer, auth modal). */\n\nconst LOGO = (fill = '#fff') => `\n  <svg viewBox=\"0 0 220 60\" aria-hidden=\"true\">\n    <g fill=\"${fill}\"><path d=\"M14 14 H58 L52 22 H8 Z\"/><path d=\"M6 28 H48 L42 36 H0 Z\"/><\/g>\n    <path fill=\"${fill}\" d=\"M66 6 H120 L112 18 H82 L78 24 H104 L96 36 H70 L60 52 H42 Z\"/>\n    <path fill=\"${fill}\" fill-rule=\"evenodd\" d=\"M138 6 H198 Q212 6 206 18 L190 44 Q186 52 172 52 H112 Q98 52 104 40 L120 14 Q125 6 138 6 Z M141 18 L127 40 H169 L183 18 Z\"/>\n  <\/svg>`;\n\n/* ---------- League data ---------- */\nconst TEAMS = [\n  { id: 'mclaren',  name: 'McLaren',         short: 'MCL', color: '#FF8000', base: 'Woking, UK',          chief: 'André Moura' },\n  { id: 'redbull',  name: 'Red Bull Racing', short: 'RBR', color: '#3671C6', base: 'Milton Keynes, UK',   chief: 'Caio Fernandes' },\n  { id: 'ferrari',  name: 'Ferrari',         short: 'FER', color: '#E8002D', base: 'Maranello, Italy',    chief: 'Marco Bellini' },\n  { id: 'mercedes', name: 'Mercedes',        short: 'MER', color: '#00A19C', base: 'Brackley, UK',        chief: 'Felipe Nunes' },\n  { id: 'aston',    name: 'Aston Martin',    short: 'AMR', color: '#229971', base: 'Silverstone, UK',     chief: 'Gustavo Reis' },\n  { id: 'alpine',   name: 'Alpine',          short: 'ALP', color: '#FF87BC', base: 'Enstone, UK',         chief: 'Léo Dubois' },\n  { id: 'williams', name: 'Williams',        short: 'WIL', color: '#1868DB', base: 'Grove, UK',           chief: 'Pedro Vidal' },\n  { id: 'rb',       name: 'Racing Bulls',    short: 'RB',  color: '#6692FF', base: 'Faenza, Italy',       chief: 'Hugo Prado' },\n  { id: 'haas',     name: 'Haas',            short: 'HAA', color: '#8C9196', base: 'Kannapolis, USA',     chief: 'Igor Teixeira' },\n  { id: 'audi',     name: 'Audi',            short: 'AUD', color: '#BB0A30', base: 'Hinwil, Switzerland', chief: 'Jonas Becker' },\n  { id: 'cadillac', name: 'Cadillac',        short: 'CAD', color: '#4A4A52', base: 'Fishers, USA',        chief: 'Mateus Cruz' },\n];\n\n// [first, last, number, team, country, points, wins, podiums, poles, birthday (MM-DD)]\nconst DRIVERS = [\n  ['Thalles','Pereira',4,'mclaren','BRA',492,9,14,8,'11-02'],\n  ['Rafael','Souza',1,'redbull','BRA',428,5,12,5,'03-14'],\n  ['Lucas','Almeida',16,'ferrari','POR',401,3,11,3,'11-09'],\n  ['Bruno','Costa',81,'mclaren','BRA',219,0,4,0,'07-21'],\n  ['Diego','Martins',63,'mercedes','BRA',207,0,3,1,'12-01'],\n  ['Matheus','Lima',22,'redbull','BRA',155,0,2,0,'05-30'],\n  ['Gabriel','Rocha',44,'ferrari','BRA',139,0,1,0,'11-15'],\n  ['Vinícius','Oliveira',12,'mercedes','BRA',165,0,1,0,'02-08'],\n  ['Felipe','Ribeiro',14,'aston','BRA',112,0,0,0,'09-19'],\n  ['João','Santos',18,'aston','BRA',86,0,0,0,'11-28'],\n  ['Pedro','Carvalho',10,'alpine','BRA',71,0,0,0,'01-17'],\n  ['Arthur','Gomes',7,'alpine','ARG',38,0,0,0,'06-04'],\n  ['Henrique','Barbosa',23,'williams','BRA',64,0,0,0,'08-12'],\n  ['Samuel','Freitas',55,'williams','BRA',52,0,0,0,'12-10'],\n  ['Enzo','Ferraz',30,'rb','BRA',47,0,0,0,'04-25'],\n  ['Davi','Moreira',6,'rb','URU',33,0,0,0,'10-30'],\n  ['Caio','Mendes',31,'haas','BRA',29,0,0,0,'03-02'],\n  ['Murilo','Araújo',87,'haas','BRA',21,0,0,0,'11-05'],\n  ['Igor','Pinto',27,'audi','BRA',24,0,0,0,'07-07'],\n  ['Renato','Duarte',5,'audi','POR',17,0,0,0,'01-29'],\n  ['Thiago','Castro',11,'cadillac','BRA',9,0,0,0,'09-03'],\n  ['Leandro','Vieira',77,'cadillac','BRA',6,0,0,0,'05-11'],\n  ['Otávio','Nogueira',2,'williams','BRA',4,0,0,0,'12-22'],\n  ['Ruan','Campos',3,'rb','BRA',3,0,0,0,'02-27'],\n  ['Kevin','Lopes',8,'haas','CHI',2,0,0,0,'06-16'],\n  ['Danilo','Farias',9,'cadillac','BRA',1,0,0,0,'11-20'],\n  ['Marcos','Sales',13,'alpine','BRA',0,0,0,0,'08-08'],\n  ['Wesley','Dias',19,'audi','BRA',0,0,0,0,'04-04'],\n  ['Yuri','Batista',25,'aston','BRA',0,0,0,0,'10-14'],\n].map(([first, last, num, team, country, pts, wins, podiums, poles, bday]) => ({\n  id: (first + '-' + last).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''),\n  first, last, num, team, country, pts, wins, podiums, poles, bday,\n  initials: first[0] + last[0],\n})).sort((a, b) => b.pts - a.pts);\nDRIVERS.forEach((d, i) => (d.pos = i + 1));\n\nconst team = id => TEAMS.find(t => t.id === id);\nTEAMS.forEach(t => {\n  t.drivers = DRIVERS.filter(d => d.team === t.id);\n  t.pts = t.drivers.reduce((s, d) => s + d.pts, 0);\n  t.wins = t.drivers.reduce((s, d) => s + d.wins, 0);\n  t.podiums = t.drivers.reduce((s, d) => s + d.podiums, 0);\n});\nTEAMS.sort((a, b) => b.pts - a.pts).forEach((t, i) => (t.pos = i + 1));\n\nconst TRACKS = [\n  ['Australia','AUS','Albert Park'],['China','CHN','Shanghai'],['Japan','JPN','Suzuka'],['Bahrain','BHR','Sakhir'],\n  ['Saudi Arabia','KSA','Jeddah Corniche'],['Miami','USA','Miami Autodrome'],['Canada','CAN','Gilles Villeneuve'],['Monaco','MON','Circuit de Monaco'],\n  ['Spain','ESP','Barcelona-Catalunya'],['Austria','AUT','Red Bull Ring'],['Great Britain','GBR','Silverstone'],['Belgium','BEL','Spa-Francorchamps'],\n  ['Hungary','HUN','Hungaroring'],['Netherlands','NED','Zandvoort'],['Italy','ITA','Monza'],['Madrid','ESP','Madring'],\n  ['Azerbaijan','AZE','Baku City Circuit'],['Singapore','SGP','Marina Bay'],['United States','USA','Circuit of the Americas'],['Mexico','MEX','Hermanos Rodríguez'],\n  ['Brazil','BRA','Interlagos'],['Las Vegas','USA','Las Vegas Strip'],['Qatar','QAT','Lusail'],['Abu Dhabi','UAE','Yas Marina'],\n];\nconst NEXT_ROUND = 18;\nconst MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\n// Weekly Wednesday races; round 18 = Wed 28 Oct 2026, 21:45\nconst RACES = TRACKS.map(([name, code, circuit], i) => {\n  const r = i + 1;\n  const date = new Date(2026, 9, 28 + (r - NEXT_ROUND) * 7, 21, 45);\n  // deterministic podium from the top 5 drivers\n  const top = DRIVERS.slice(0, 5);\n  const podium = r < NEXT_ROUND ? [top[(r * 7) % 3], top[(r * 7 + 1) % 3], top[3 + (r % 2)]] : null;\n  return { r, name, code, circuit, date, podium, status: r < NEXT_ROUND ? 'done' : r === NEXT_ROUND ? 'next' : 'upcoming' };\n});\nconst fmtDate = d => `${String(d.getDate()).padStart(2, '0')} ${MONTHS[d.getMonth()]}`;\n\nconst COMPLAINTS = [\n  { id: 'FZ-S2-041', round: 17, lap: 1, status: 'penalty', by: 'Rafael Souza', against: 'Gabriel Rocha', title: 'Divebomb at Turn 1 causing collision', desc: 'Rocha braked too late and hit my rear, I lost the front wing and 6 positions.', verdict: '+5s time penalty and 2 penalty points for Rocha.', files: 2 },\n  { id: 'FZ-S2-040', round: 17, lap: 23, status: 'noaction', by: 'Enzo Ferraz', against: 'Caio Mendes', title: 'Moving under braking into Turn 3', desc: 'Mendes moved twice in the braking zone defending the position.', verdict: 'Racing incident. Single move confirmed by replay.', files: 1 },\n  { id: 'FZ-S2-039', round: 17, lap: 31, status: 'review', by: 'Felipe Ribeiro', against: 'Pedro Carvalho', title: 'Track limits abuse in the last sector', desc: 'Carvalho repeatedly cut Turn 16 to gain time while I was in DRS range.', verdict: null, files: 3 },\n  { id: 'FZ-S2-038', round: 16, lap: 12, status: 'pending', by: 'Igor Pinto', against: 'Leandro Vieira', title: 'Unsafe rejoin after spin', desc: 'Vieira rejoined across the racing line and I had to take avoiding action.', verdict: null, files: 1 },\n];\n\n/* ---------- Chrome ---------- */\nconst NAV = [\n  ['index.html', 'Home'], ['calendar.html', 'Schedule'], ['standings.html', 'Standings'],\n  ['drivers.html', 'Drivers'], ['teams.html', 'Teams'], ['stewards.html', 'Stewards'],\n];\nconst MORE = [\n  ['stewards.html', 'File a complaint'], ['stewards.html#decisions', 'Stewards decisions'],\n  ['#', 'Sporting regulations'], ['#', 'Penalty points'], ['index.html#birthdays', 'Birthdays'],\n  ['#', 'Hall of fame'], ['#', 'Admin area'],\n];\n\nfunction renderChrome() {\n  const page = location.pathname.split('/').pop() || 'index.html';\n  const active = document.body.dataset.page || page;\n\n  document.body.insertAdjacentHTML('afterbegin', `\n  <div class=\"topbar\"><div class=\"wrap\">\n    <nav><a href=\"#\">FZ TV<\/a><a href=\"#\">Live timing<\/a><a href=\"https://discord.com\" target=\"_blank\">Discord<\/a><a href=\"#\">Store<\/a><\/nav>\n    <nav><a href=\"#\" data-auth=\"login\">Sign in<\/a><a href=\"#\">Admin<\/a><a href=\"#\">EN ▾<\/a><\/nav>\n  <\/div><\/div>\n  <header class=\"nav\"><div class=\"wrap\">\n    <a class=\"logo\" href=\"index.html\" aria-label=\"Formula Zero home\">${LOGO('#fff')}<\/a>\n    <nav class=\"menu\">\n      ${NAV.map(([h, l]) => `<a href=\"${h}\" class=\"${h === active ? 'active' : ''}\">${l}<\/a>`).join('')}\n      <div class=\"more-wrap\"><button>More ▾<\/button><div class=\"dropdown\">\n        ${MORE.map(([h, l]) => `<a href=\"${h}\">${l}<\/a>`).join('')}\n      <\/div><\/div>\n    <\/nav>\n    <div class=\"nav-actions\">\n      <a class=\"btn btn-ghost\" href=\"#\" data-auth=\"login\">Sign in<\/a>\n      <a class=\"btn btn-white\" href=\"#\" data-auth=\"signup\">Join the grid<\/a>\n    <\/div>\n    <button class=\"burger\" aria-label=\"Menu\">☰<\/button>\n  <\/div>\n  <div class=\"mobile-menu\">${NAV.map(([h, l]) => `<a href=\"${h}\">${l}<\/a>`).join('')}<a href=\"#\" data-auth=\"login\">Sign in / Join<\/a><\/div>\n  <\/header>`);\n\n  document.body.insertAdjacentHTML('beforeend', `\n  <footer><div class=\"wrap\">\n    <div class=\"fgrid\">\n      <div>\n        <div style=\"height:40px;width:150px\">${LOGO('#E10600')}<\/div>\n        <p style=\"margin-top:16px;max-width:280px\">The sim racing league for beginner and intermediate drivers. Every Wednesday, lights out at 21:45.<\/p>\n        <div class=\"social\"><a href=\"#\">YT<\/a><a href=\"#\">IG<\/a><a href=\"#\">X<\/a><a href=\"#\">DC<\/a><\/div>\n      <\/div>\n      <div><h5>Racing<\/h5><ul><li><a href=\"calendar.html\">Schedule<\/a><\/li><li><a href=\"calendar.html\">Results<\/a><\/li><li><a href=\"standings.html\">Standings<\/a><\/li><li><a href=\"#\">Live timing<\/a><\/li><\/ul><\/div>\n      <div><h5>The grid<\/h5><ul><li><a href=\"drivers.html\">Drivers<\/a><\/li><li><a href=\"teams.html\">Teams<\/a><\/li><li><a href=\"#\">Hall of fame<\/a><\/li><li><a href=\"index.html#birthdays\">Birthdays<\/a><\/li><\/ul><\/div>\n      <div><h5>League<\/h5><ul><li><a href=\"#\" data-auth=\"signup\">Join<\/a><\/li><li><a href=\"#\">Sporting regulations<\/a><\/li><li><a href=\"stewards.html\">Stewards<\/a><\/li><li><a href=\"#\">Discord<\/a><\/li><\/ul><\/div>\n      <div><h5>About<\/h5><ul><li><a href=\"#\">About us<\/a><\/li><li><a href=\"#\">Partners<\/a><\/li><li><a href=\"#\">Contact<\/a><\/li><li><a href=\"#\">Admin area<\/a><\/li><\/ul><\/div>\n    <\/div>\n    <div class=\"legal\"><span>© 2026 Formula Zero League. Not affiliated with Formula 1.<\/span><span><a href=\"#\">Privacy<\/a> · <a href=\"#\">Terms<\/a> · <a href=\"#\">Cookies<\/a><\/span><\/div>\n  <\/div><\/footer>\n\n  <div class=\"modal\" id=\"auth\"><div class=\"box\">\n    <div class=\"mh\"><div style=\"width:110px\">${LOGO('#fff')}<\/div><button data-close aria-label=\"Close\">×<\/button><\/div>\n    <div class=\"mb\">\n      <div class=\"bigtabs\"><button data-tab=\"login\" class=\"on\">Sign in<\/button><button data-tab=\"signup\">Create account<\/button><\/div>\n      <div class=\"field signup-only\"><label>Driver name<\/label><input placeholder=\"e.g. Thalles Pereira\"><\/div>\n      <div class=\"field\"><label>Email<\/label><input type=\"email\" placeholder=\"you@email.com\"><\/div>\n      <div class=\"field\"><label>Password<\/label><input type=\"password\" placeholder=\"••••••••\"><\/div>\n      <div class=\"form-grid signup-only\">\n        <div class=\"field\"><label>Race number<\/label><input type=\"number\" min=\"2\" max=\"99\" placeholder=\"2–99\"><\/div>\n        <div class=\"field\"><label>Birthday<\/label><input type=\"date\"><\/div>\n        <div class=\"field full\"><label>Platform<\/label><select><option>PC (Steam)<\/option><option>PlayStation<\/option><option>Xbox<\/option><\/select><\/div>\n      <\/div>\n      <button class=\"btn btn-red btn-full\" data-close data-toast=\"Welcome to Formula Zero!\">Continue<\/button>\n      <div class=\"or\">OR<\/div>\n      <button class=\"btn btn-dark btn-full\" data-close data-toast=\"Signed in with Discord\">Continue with Discord<\/button>\n    <\/div>\n  <\/div><\/div>\n  <div class=\"toast\" id=\"toast\"><\/div>`);\n\n  // interactions\n  document.querySelector('.burger').onclick = () => document.querySelector('.mobile-menu').classList.toggle('open');\n  const modal = document.getElementById('auth');\n  const setTab = tab => {\n    modal.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));\n    modal.querySelectorAll('.signup-only').forEach(el => (el.style.display = tab === 'signup' ? '' : 'none'));\n  };\n  document.addEventListener('click', e => {\n    const a = e.target.closest('[data-auth]');\n    if (a) { e.preventDefault(); setTab(a.dataset.auth); modal.classList.add('open'); }\n    const t = e.target.closest('[data-tab]');\n    if (t) setTab(t.dataset.tab);\n    if (e.target === modal || e.target.closest('[data-close]')) {\n      modal.classList.remove('open');\n      const msg = e.target.closest('[data-toast]');\n      if (msg) toast(msg.dataset.toast);\n    }\n  });\n}\n\nfunction toast(msg) {\n  const t = document.getElementById('toast');\n  t.textContent = msg; t.classList.add('show');\n  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800);\n}\n\n/* ---------- Reusable bits ---------- */\nconst driverCard = d => {\n  const t = team(d.team);\n  return `<a class=\"dcard\" href=\"driver.html?id=${d.id}\" style=\"background:${t.color}\">\n    <span class=\"num\">${d.num}<\/span>\n    <div><div class=\"pos\">P${d.pos} · ${d.country}<\/div><\/div>\n    <div class=\"avatar\">${d.initials}<\/div>\n    <div><div class=\"first\">${d.first}<\/div><div class=\"last\">${d.last}<\/div><div class=\"team\">${t.name}<\/div><\/div>\n    <span class=\"pts\">${d.pts} PTS<\/span>\n  <\/a>`;\n};\n\nfunction startCountdown(target, prefix = 'cd') {\n  const pad = n => String(n).padStart(2, '0');\n  const tick = () => {\n    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));\n    const v = [Math.floor(s / 86400), Math.floor((s % 86400) / 3600), Math.floor((s % 3600) / 60), s % 60];\n    ['d', 'h', 'm', 's'].forEach((k, i) => { const el = document.getElementById(`${prefix}-${k}`); if (el) el.textContent = pad(v[i]); });\n  };\n  tick(); setInterval(tick, 1000);\n}\n\nrenderChrome();\n"},"pages":{"index.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Formula Zero — Home<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700;1,900&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"styles.css\">\n<link rel=\"stylesheet\" href=\"pages.css\">\n<\/head>\n<body data-page=\"index.html\">\n\n<\!-- Hero: next Grand Prix -->\n<section class=\"hero\">\n  <div class=\"stripes\"><i><\/i><i><\/i><i><\/i><\/div>\n  <div class=\"wrap\">\n    <div>\n      <div class=\"round\"><b id=\"hero-round\">Round 18<\/b> Season 2 · Next Grand Prix<\/div>\n      <h1 id=\"hero-title\">Singapore<br><em>Grand Prix<\/em><\/h1>\n      <p class=\"lead\" id=\"hero-lead\"><\/p>\n      <div class=\"ctas\">\n        <a class=\"btn btn-red arrow\" href=\"calendar.html\">Race hub<\/a>\n        <a class=\"btn btn-ghost\" href=\"#\">Watch live<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"countdown-card\">\n      <h3>Lights out in<\/h3>\n      <div class=\"countdown\">\n        <div><strong id=\"cd-d\">00<\/strong><small>Days<\/small><\/div>\n        <div><strong id=\"cd-h\">00<\/strong><small>Hrs<\/small><\/div>\n        <div><strong id=\"cd-m\">00<\/strong><small>Mins<\/small><\/div>\n        <div><strong id=\"cd-s\">00<\/strong><small>Secs<\/small><\/div>\n      <\/div>\n      <ul class=\"sessions\">\n        <li class=\"live\"><span>Lobby opens<\/span><span>Wed 21:30<\/span><\/li>\n        <li><span>Qualifying<\/span><span>Wed 21:45<\/span><\/li>\n        <li><span>Race<\/span><span>Wed 22:15<\/span><\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- Season stats -->\n<div class=\"stats\"><div class=\"wrap\">\n  <div class=\"stat\"><strong id=\"st-teams\">11<\/strong><span>Teams<\/span><\/div>\n  <div class=\"stat\"><strong id=\"st-drivers\">29<\/strong><span>Drivers<\/span><\/div>\n  <div class=\"stat\"><strong>17<small style=\"font-size:22px;color:var(--gray-light)\">/24<\/small><\/strong><span>Rounds completed<\/span><\/div>\n  <div class=\"stat\"><strong>S2<\/strong><span>Current season<\/span><\/div>\n<\/div><\/div>\n\n<\!-- News -->\n<section class=\"block\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">News<\/div><h2>Latest from the paddock<\/h2><\/div><a href=\"#\">All news<\/a><\/div>\n  <div class=\"news\">\n    <a class=\"card feature\" href=\"#\">\n      <div class=\"img ph1\"><div class=\"ph-car\">FZ<\/div><span class=\"tag\">Race report<\/span><\/div>\n      <div class=\"body\"><h3>Pereira extends lead to 64 points with dominant win in Baku<\/h3><p>The McLaren driver controlled the race from pole as his rivals tangled at Turn 1.<\/p><\/div>\n    <\/a>\n    <a class=\"card\" href=\"teams.html\"><div class=\"img ph2\"><span class=\"tag\">Analysis<\/span><\/div><div class=\"body\"><h3>How McLaren built a 711-point constructors' lead<\/h3><\/div><\/a>\n    <a class=\"card\" href=\"#\"><div class=\"img ph3\"><span class=\"tag\">Interview<\/span><\/div><div class=\"body\"><h3>\"We're coming for it\": Red Bull eye Singapore comeback<\/h3><\/div><\/a>\n    <a class=\"card\" href=\"stewards.html#decisions\"><div class=\"img ph4\"><span class=\"tag\">Stewards<\/span><\/div><div class=\"body\"><h3>Round 17 decisions: one penalty, one racing incident<\/h3><\/div><\/a>\n    <a class=\"card\" href=\"#\" data-auth=\"signup\"><div class=\"img ph5\"><span class=\"tag\">League<\/span><\/div><div class=\"body\"><h3>Season 3 sign-ups open next month: what changes<\/h3><\/div><\/a>\n  <\/div>\n<\/div><\/section>\n\n<\!-- Standings snapshot -->\n<section class=\"block standings-bg\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">2026 Season<\/div><h2>Championship standings<\/h2><\/div><a href=\"standings.html\">Full standings<\/a><\/div>\n  <div class=\"standings\">\n    <div class=\"table\">\n      <div class=\"thead\"><h3>Drivers<\/h3><\/div>\n      <div id=\"snap-drivers\"><\/div>\n      <a class=\"more\" href=\"standings.html\">View all drivers →<\/a>\n    <\/div>\n    <div class=\"table\">\n      <div class=\"thead\"><h3>Teams<\/h3><\/div>\n      <div id=\"snap-teams\"><\/div>\n      <a class=\"more\" href=\"standings.html#teams\">View all teams →<\/a>\n    <\/div>\n  <\/div>\n<\/div><\/section>\n\n<\!-- Calendar strip -->\n<section class=\"block\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">Schedule<\/div><h2>Race calendar<\/h2><\/div><a href=\"calendar.html\">Full schedule<\/a><\/div>\n  <div class=\"calendar\" id=\"cal\"><\/div>\n<\/div><\/section>\n\n<\!-- Explore (Exodus feature) -->\n<section class=\"block\" style=\"padding-top:0\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">Explore<\/div><h2>Everything in the league<\/h2><\/div><\/div>\n  <div class=\"explore\">\n    <a class=\"ex\" href=\"drivers.html\"><h4>Drivers<\/h4><p>Profiles, numbers and season stats for the full grid.<\/p><\/a>\n    <a class=\"ex\" href=\"teams.html\"><h4>Teams<\/h4><p>Line-ups, team principals and constructors' points.<\/p><\/a>\n    <a class=\"ex\" href=\"standings.html\"><h4>Standings<\/h4><p>Drivers' and constructors' championship tables.<\/p><\/a>\n    <a class=\"ex\" href=\"stewards.html\"><h4>Stewards<\/h4><p>File a complaint with video evidence and track decisions.<\/p><\/a>\n  <\/div>\n<\/div><\/section>\n\n<\!-- Birthdays (Exodus feature) -->\n<section class=\"block\" id=\"birthdays\" style=\"padding-top:0\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">Paddock<\/div><h2>Upcoming birthdays<\/h2><\/div><\/div>\n  <div class=\"bdays\" id=\"bdays\"><\/div>\n<\/div><\/section>\n\n<\!-- Featured drivers -->\n<section class=\"block\" style=\"padding-top:0\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">The grid<\/div><h2>Title contenders<\/h2><\/div><a href=\"drivers.html\">All drivers<\/a><\/div>\n  <div class=\"driver-grid\" id=\"featured\"><\/div>\n<\/div><\/section>\n\n<\!-- Join CTA -->\n<section class=\"cta\" id=\"join\"><div class=\"wrap\">\n  <div>\n    <div class=\"eyebrow\" style=\"color:#fff;opacity:.8\">Season 3 · Open grid<\/div>\n    <h2>Your seat<br>is waiting.<\/h2>\n    <p>Formula Zero is built for beginner and intermediate sim racers. Clean racing, real stewards, a Grand Prix every Wednesday night.<\/p>\n    <a class=\"btn btn-white arrow\" href=\"#\" data-auth=\"signup\">Create your driver profile<\/a>\n  <\/div>\n  <ul>\n    <li><b>01<\/b>Create an account and pick your number<\/li>\n    <li><b>02<\/b>Complete a qualifying time trial<\/li>\n    <li><b>03<\/b>Get assigned to a team and race on Wednesday<\/li>\n  <\/ul>\n<\/div><\/section>\n\n<script src=\"site.js\"><\/script>\n<script>\n  const next = RACES.find(r => r.status === 'next');\n  document.getElementById('hero-round').textContent = 'Round ' + next.r;\n  document.getElementById('hero-title').innerHTML = `${next.name}<br><em>Grand Prix<\/em>`;\n  document.getElementById('hero-lead').textContent = `${next.circuit}. Lobby opens at 21:30, qualifying at 21:45, and the championship lead is on the line.`;\n  document.getElementById('st-teams').textContent = TEAMS.length;\n  document.getElementById('st-drivers').textContent = DRIVERS.length;\n  startCountdown(next.date.getTime());\n\n  const row = (pos, color, name, sub, pts, href) =>\n    `<a class=\"row ${pos === 1 ? 'leader' : ''}\" href=\"${href}\"><span class=\"pos\">${pos}<\/span><span class=\"bar\" style=\"background:${color}\"><\/span><span class=\"name\"><b>${name}<\/b><small>${sub}<\/small><\/span><span class=\"pts\">${pts}<\/span><\/a>`;\n  document.getElementById('snap-drivers').innerHTML = DRIVERS.slice(0, 5)\n    .map(d => row(d.pos, team(d.team).color, d.first + ' ' + d.last, team(d.team).name, d.pts, 'driver.html?id=' + d.id)).join('');\n  document.getElementById('snap-teams').innerHTML = TEAMS.slice(0, 5)\n    .map(t => row(t.pos, t.color, t.name, t.drivers.slice(0, 2).map(d => d.last).join(' · '), t.pts, 'teams.html#' + t.id)).join('');\n\n  const trackSvg = '<svg class=\"track\" viewBox=\"0 0 100 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linejoin=\"round\"><path d=\"M10 70 L30 20 L60 15 L90 40 L70 55 L85 85 L40 90 Z\"/><\/svg>';\n  document.getElementById('cal').innerHTML = RACES.filter(r => r.r >= next.r - 3 && r.r <= next.r + 4).map(x => `\n    <a class=\"race ${x.status}\" href=\"calendar.html#r${x.r}\">\n      <div class=\"r\">Round ${x.r}<\/div><div class=\"date\">${fmtDate(x.date)}<\/div>\n      <h4><span class=\"country\">${x.code}<\/span>${x.name}<\/h4><p>${x.circuit}<\/p>${trackSvg}\n    <\/a>`).join('');\n\n  // Upcoming birthdays: days until next occurrence\n  const today = new Date(); today.setHours(0, 0, 0, 0);\n  const daysTo = mmdd => {\n    const [m, d] = mmdd.split('-').map(Number);\n    let b = new Date(today.getFullYear(), m - 1, d);\n    if (b < today) b = new Date(today.getFullYear() + 1, m - 1, d);\n    return Math.round((b - today) / 864e5);\n  };\n  document.getElementById('bdays').innerHTML = DRIVERS.map(d => ({ d, n: daysTo(d.bday) }))\n    .sort((a, b) => a.n - b.n).slice(0, 4).map(({ d, n }) => `\n    <a class=\"bday\" href=\"driver.html?id=${d.id}\">\n      <span class=\"mini\" style=\"background:${team(d.team).color}\">${d.initials}<\/span>\n      <span><b>${d.first} ${d.last}<\/b><small>${team(d.team).name}<\/small><\/span>\n      <span class=\"in\">${n === 0 ? 'Today' : n}<small>${n === 0 ? '' : n === 1 ? 'day' : 'days'}<\/small><\/span>\n    <\/a>`).join('');\n\n  document.getElementById('featured').innerHTML = DRIVERS.slice(0, 4).map(driverCard).join('');\n<\/script>\n<\/body>\n<\/html>\n","drivers.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Formula Zero — Drivers<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700;1,900&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"styles.css\">\n<link rel=\"stylesheet\" href=\"pages.css\">\n<\/head>\n<body data-page=\"drivers.html\">\n\n<section class=\"page-head\"><div class=\"wrap\">\n  <div class=\"crumbs\"><a href=\"index.html\">Home<\/a> / Drivers<\/div>\n  <h1>Season 2 Drivers<\/h1>\n  <p>Meet the full Formula Zero grid: every driver, their number and their season so far.<\/p>\n<\/div><\/section>\n\n<section class=\"block\" style=\"padding-top:40px\"><div class=\"wrap\">\n  <div class=\"filterbar\" id=\"filters\">\n    <button class=\"chip on\" data-team=\"all\">All teams<\/button>\n  <\/div>\n  <div class=\"driver-grid\" id=\"grid\"><\/div>\n<\/div><\/section>\n\n<script src=\"site.js\"><\/script>\n<script>\n  const filters = document.getElementById('filters');\n  filters.insertAdjacentHTML('beforeend',\n    TEAMS.map(t => `<button class=\"chip\" data-team=\"${t.id}\">${t.name}<\/button>`).join('') +\n    '<input class=\"search\" id=\"q\" placeholder=\"Search driver or number…\">');\n  let teamFilter = 'all';\n  const draw = () => {\n    const q = document.getElementById('q').value.trim().toLowerCase();\n    document.getElementById('grid').innerHTML = DRIVERS\n      .filter(d => teamFilter === 'all' || d.team === teamFilter)\n      .filter(d => !q || `${d.first} ${d.last} ${d.num}`.toLowerCase().includes(q))\n      .map(driverCard).join('') || '<p>No drivers match.<\/p>';\n  };\n  filters.addEventListener('click', e => {\n    const b = e.target.closest('.chip'); if (!b) return;\n    filters.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));\n    teamFilter = b.dataset.team; draw();\n  });\n  document.getElementById('q').addEventListener('input', draw);\n  draw();\n<\/script>\n<\/body>\n<\/html>\n","driver.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Formula Zero — Driver<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700;1,900&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"styles.css\">\n<link rel=\"stylesheet\" href=\"pages.css\">\n<\/head>\n<body data-page=\"drivers.html\">\n\n<section class=\"profile-hero\" id=\"hero\"><\/section>\n\n<section class=\"block\" style=\"padding-top:48px\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">Season 2<\/div><h2>Season stats<\/h2><\/div><\/div>\n  <div class=\"kv\" id=\"stats\"><\/div>\n<\/div><\/section>\n\n<section class=\"block\" style=\"padding-top:0\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">Results<\/div><h2>Race by race<\/h2><\/div><\/div>\n  <div class=\"table-scroll\"><table class=\"dtable\" id=\"results\"><\/table><\/div>\n<\/div><\/section>\n\n<section class=\"block\" style=\"padding-top:0\"><div class=\"wrap\">\n  <div class=\"sec-head\"><div><div class=\"eyebrow\">Teammate<\/div><h2>Same garage<\/h2><\/div><a href=\"drivers.html\">All drivers<\/a><\/div>\n  <div class=\"driver-grid\" id=\"mates\"><\/div>\n<\/div><\/section>\n\n<script src=\"site.js\"><\/script>\n<script>\n  const id = new URLSearchParams(__FZ.search).get('id');\n  const d = DRIVERS.find(x => x.id === id) || DRIVERS[0];\n  const t = team(d.team);\n  document.title = `Formula Zero — ${d.first} ${d.last}`;\n  const hero = document.getElementById('hero');\n  hero.style.background = t.color;\n  hero.innerHTML = `<div class=\"wrap\">\n    <div class=\"avatar\">${d.initials}<\/div>\n    <div>\n      <div class=\"crumbs\" style=\"color:rgba(255,255,255,.8)\"><a href=\"drivers.html\">Drivers<\/a> / ${d.last}<\/div>\n      <div class=\"first\" style=\"margin-top:10px\">${d.first}<\/div>\n      <h1>${d.last}<\/h1>\n      <div style=\"font-weight:700;margin-top:8px;font-size:18px\">${t.name} · ${d.country}<\/div>\n    <\/div>\n    <div class=\"bignum\">${d.num}<\/div><\/div>`;\n\n  const [m, day] = d.bday.split('-');\n  document.getElementById('stats').innerHTML = [\n    ['Position', 'P' + d.pos], ['Points', d.pts], ['Wins', d.wins], ['Podiums', d.podiums],\n    ['Poles', d.poles], ['Race number', '#' + d.num], ['Team', t.short], ['Birthday', `${day} ${MONTHS[m - 1]}`],\n  ].map(([k, v]) => `<div><span>${k}<\/span><strong>${v}<\/strong><\/div>`).join('');\n\n  // Plausible per-round finishing positions derived from championship position\n  const finish = r => Math.max(1, Math.min(22, Math.round(d.pos + ((r * 37 + d.num) % 7) - 3)));\n  const PTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];\n  document.getElementById('results').innerHTML =\n    '<tr><th>Round<\/th><th>Grand Prix<\/th><th>Date<\/th><th>Finish<\/th><th class=\"r\">Points<\/th><\/tr>' +\n    RACES.filter(r => r.status === 'done').reverse().map(r => {\n      const f = finish(r.r);\n      return `<tr><td class=\"pos\">${r.r}<\/td><td><span class=\"country\">${r.code}<\/span>${r.name}<\/td><td class=\"sub\">${fmtDate(r.date)}<\/td><td>P${f}<\/td><td class=\"pts\">${PTS[f - 1] || 0}<\/td><\/tr>`;\n    }).join('');\n\n  document.getElementById('mates').innerHTML = t.drivers.filter(x => x !== d).map(driverCard).join('')\n    || '<p>No teammate this season.<\/p>';\n<\/script>\n<\/body>\n<\/html>\n","teams.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Formula Zero — Teams<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700;1,900&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"styles.css\">\n<link rel=\"stylesheet\" href=\"pages.css\">\n<\/head>\n<body data-page=\"teams.html\">\n\n<section class=\"page-head\"><div class=\"wrap\">\n  <div class=\"crumbs\"><a href=\"index.html\">Home<\/a> / Teams<\/div>\n  <h1>Season 2 Teams<\/h1>\n  <p>11 constructors, every line-up and every point in the constructors' championship.<\/p>\n<\/div><\/section>\n\n<section class=\"block\" style=\"padding-top:40px\"><div class=\"wrap\">\n  <div class=\"team-grid\" id=\"teams\"><\/div>\n<\/div><\/section>\n\n<script src=\"site.js\"><\/script>\n<script>\n  document.getElementById('teams').innerHTML = TEAMS.map(t => `\n    <div class=\"tcard\" id=\"${t.id}\" style=\"background:${t.color}\">\n      <div class=\"top\">\n        <div>\n          <div class=\"rank\">P${t.pos} · Constructors<\/div>\n          <h3>${t.name}<\/h3>\n          <span class=\"tpts\">${t.pts} PTS<\/span>\n        <\/div>\n        <div class=\"badge\">${t.short}<\/div>\n      <\/div>\n      <div class=\"pair\">\n        ${t.drivers.map(d => `<a href=\"driver.html?id=${d.id}\"><span class=\"mini\">${d.num}<\/span>${d.first} ${d.last}<\/a>`).join('')}\n      <\/div>\n      <div style=\"font-size:13px;font-weight:600;opacity:.85\">Team principal: ${t.chief} · ${t.base} · ${t.wins} wins · ${t.podiums} podiums<\/div>\n    <\/div>`).join('');\n  if (__FZ.hash) document.querySelector(__FZ.hash)?.scrollIntoView({ block: 'center' });\n<\/script>\n<\/body>\n<\/html>\n","standings.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Formula Zero — Standings<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700;1,900&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"styles.css\">\n<link rel=\"stylesheet\" href=\"pages.css\">\n<\/head>\n<body data-page=\"standings.html\">\n\n<section class=\"page-head\"><div class=\"wrap\">\n  <div class=\"crumbs\"><a href=\"index.html\">Home<\/a> / Standings<\/div>\n  <h1>2026 Standings<\/h1>\n  <p>Season 2 championship after Round 17 of 24.<\/p>\n<\/div><\/section>\n\n<section class=\"block\" style=\"padding-top:32px\"><div class=\"wrap\">\n  <div class=\"bigtabs\" id=\"tabs\">\n    <button data-t=\"drivers\" class=\"on\">Drivers<\/button>\n    <button data-t=\"teams\">Teams<\/button>\n  <\/div>\n  <div class=\"table-scroll\"><table class=\"dtable\" id=\"tbl\"><\/table><\/div>\n<\/div><\/section>\n\n<script src=\"site.js\"><\/script>\n<script>\n  const leaderD = DRIVERS[0].pts, leaderT = TEAMS[0].pts;\n  const gap = (p, max) => `<div class=\"gap-bar\"><i style=\"width:${(p / max) * 100}%\"><\/i><\/div>`;\n  const views = {\n    drivers: '<tr><th>Pos<\/th><th>Driver<\/th><th>Nat<\/th><th>Team<\/th><th>Wins<\/th><th>Gap<\/th><th class=\"r\">Pts<\/th><\/tr>' +\n      DRIVERS.map(d => `<tr>\n        <td class=\"pos\">${d.pos}<\/td>\n        <td><a href=\"driver.html?id=${d.id}\"><span class=\"teamdot\" style=\"background:${team(d.team).color}\"><\/span>${d.first} <b style=\"text-transform:uppercase\">${d.last}<\/b><\/a><\/td>\n        <td class=\"sub\">${d.country}<\/td><td>${team(d.team).name}<\/td><td>${d.wins}<\/td>\n        <td>${gap(d.pts, leaderD)}<span class=\"sub\">${d.pos === 1 ? 'Leader' : '-' + (leaderD - d.pts)}<\/span><\/td>\n        <td class=\"pts\">${d.pts}<\/td><\/tr>`).join(''),\n    teams: '<tr><th>Pos<\/th><th>Team<\/th><th>Drivers<\/th><th>Wins<\/th><th>Gap<\/th><th class=\"r\">Pts<\/th><\/tr>' +\n      TEAMS.map(t => `<tr>\n        <td class=\"pos\">${t.pos}<\/td>\n        <td><a href=\"teams.html#${t.id}\"><span class=\"teamdot\" style=\"background:${t.color}\"><\/span><b>${t.name}<\/b><\/a><\/td>\n        <td class=\"sub\">${t.drivers.map(d => d.last).join(' · ')}<\/td><td>${t.wins}<\/td>\n        <td>${gap(t.pts, leaderT)}<span class=\"sub\">${t.pos === 1 ? 'Leader' : '-' + (leaderT - t.pts)}<\/span><\/td>\n        <td class=\"pts\">${t.pts}<\/td><\/tr>`).join(''),\n  };\n  const show = v => {\n    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === v));\n    document.getElementById('tbl').innerHTML = views[v];\n  };\n  document.getElementById('tabs').onclick = e => e.target.dataset.t && show(e.target.dataset.t);\n  show(__FZ.hash === '#teams' ? 'teams' : 'drivers');\n<\/script>\n<\/body>\n<\/html>\n","calendar.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Formula Zero — Schedule<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700;1,900&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"styles.css\">\n<link rel=\"stylesheet\" href=\"pages.css\">\n<\/head>\n<body data-page=\"calendar.html\">\n\n<section class=\"page-head\"><div class=\"wrap\">\n  <div class=\"crumbs\"><a href=\"index.html\">Home<\/a> / Schedule<\/div>\n  <h1>2026 Schedule<\/h1>\n  <p>24 rounds, every Wednesday. Lobby opens 21:30, qualifying 21:45, race right after.<\/p>\n<\/div><\/section>\n\n<section class=\"block\" style=\"padding-top:32px\"><div class=\"wrap\">\n  <div class=\"filterbar\" id=\"f\">\n    <button class=\"chip on\" data-s=\"all\">All rounds<\/button>\n    <button class=\"chip\" data-s=\"upcoming\">Upcoming<\/button>\n    <button class=\"chip\" data-s=\"done\">Results<\/button>\n  <\/div>\n  <div id=\"list\"><\/div>\n<\/div><\/section>\n\n<script src=\"site.js\"><\/script>\n<script>\n  let filter = 'all';\n  const draw = () => {\n    document.getElementById('list').innerHTML = RACES\n      .filter(r => filter === 'all' || (filter === 'done' ? r.status === 'done' : r.status !== 'done'))\n      .map(r => `\n      <div class=\"round-row ${r.status === 'next' ? 'next' : ''}\" id=\"r${r.r}\">\n        <div class=\"d\"><small>Round ${r.r}<\/small>${fmtDate(r.date)}<\/div>\n        <div><h4><span class=\"country\">${r.code}<\/span>${r.name} Grand Prix<\/h4><p>${r.circuit}<\/p><\/div>\n        <div class=\"podium\">${r.podium\n          ? r.podium.map((d, i) => `<span>P${i + 1} ${d.last}<\/span>`).join('')\n          : r.status === 'next' ? '<span style=\"background:#fff;color:var(--red)\">Next race<\/span>' : ''}<\/div>\n        ${r.status === 'done'\n          ? '<a class=\"btn btn-outline\" href=\"#\">Results<\/a>'\n          : r.status === 'next' ? '<a class=\"btn btn-ghost\" href=\"index.html\">Race hub<\/a>' : '<a class=\"btn btn-outline\" href=\"#\">Add to calendar<\/a>'}\n      <\/div>`).join('');\n  };\n  document.getElementById('f').onclick = e => {\n    const b = e.target.closest('.chip'); if (!b) return;\n    document.querySelectorAll('#f .chip').forEach(c => c.classList.toggle('on', c === b));\n    filter = b.dataset.s; draw();\n  };\n  draw();\n  if (__FZ.hash) document.querySelector(__FZ.hash)?.scrollIntoView({ block: 'center' });\n<\/script>\n<\/body>\n<\/html>\n","stewards.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Formula Zero — Stewards<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,700;1,900&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"styles.css\">\n<link rel=\"stylesheet\" href=\"pages.css\">\n<\/head>\n<body data-page=\"stewards.html\">\n\n<section class=\"page-head\"><div class=\"wrap\">\n  <div class=\"crumbs\"><a href=\"index.html\">Home<\/a> / Stewards<\/div>\n  <h1>Stewards' Room<\/h1>\n  <p>Report an incident with video evidence. The stewards review every complaint before the next round.<\/p>\n<\/div><\/section>\n\n<section class=\"block\" style=\"padding-top:40px\"><div class=\"wrap\">\n  <div class=\"steps\">\n    <div><b>01<\/b><span>Submit within 48h of the race<\/span><\/div>\n    <div><b>02<\/b><span>Attach a clip of the incident<\/span><\/div>\n    <div><b>03<\/b><span>Stewards review the replay<\/span><\/div>\n    <div><b>04<\/b><span>Decision published here<\/span><\/div>\n  <\/div>\n\n  <div class=\"two-col\">\n    <\!-- Complaint form -->\n    <form class=\"panel\" id=\"form\">\n      <h2>File a complaint<\/h2>\n      <p class=\"hint\">All fields are required unless marked optional.<\/p>\n      <div class=\"form-grid\">\n        <div class=\"field\"><label>Round<\/label><select id=\"f-round\" required><\/select><\/div>\n        <div class=\"field\"><label>Session<\/label><select><option>Race<\/option><option>Qualifying<\/option><option>Lobby / formation lap<\/option><\/select><\/div>\n        <div class=\"field\"><label>Your name<\/label><select id=\"f-by\" required><\/select><\/div>\n        <div class=\"field\"><label>Driver involved<\/label><select id=\"f-against\" required><\/select><\/div>\n        <div class=\"field\"><label>Lap<\/label><input id=\"f-lap\" type=\"number\" min=\"1\" placeholder=\"e.g. 12\" required><\/div>\n        <div class=\"field\"><label>Turn / sector (optional)<\/label><input placeholder=\"e.g. Turn 1\"><\/div>\n        <div class=\"field full\"><label>Incident type<\/label>\n          <select id=\"f-type\"><option>Causing a collision<\/option><option>Unsafe rejoin<\/option><option>Track limits<\/option><option>Moving under braking<\/option><option>Ignoring blue flags<\/option><option>Unsportsmanlike behaviour<\/option><option>Other<\/option><\/select><\/div>\n        <div class=\"field full\"><label>What happened?<\/label><textarea id=\"f-desc\" placeholder=\"Describe the incident and how it affected your race.\" required><\/textarea><\/div>\n        <div class=\"field full\"><label>Evidence (video / screenshots)<\/label>\n          <label class=\"dropzone\" id=\"drop\">\n            <input type=\"file\" id=\"file\" accept=\"video/*,image/*\" multiple hidden>\n            <div class=\"ico\">↑<\/div>\n            <strong>Drag clips here or click to upload<\/strong>\n            <small>MP4, MOV, PNG or JPG up to 500 MB · or paste a YouTube / Twitch link below<\/small>\n          <\/label>\n          <ul class=\"files\" id=\"files\"><\/ul>\n        <\/div>\n        <div class=\"field full\"><label>Video link (optional)<\/label><input type=\"url\" placeholder=\"https://youtu.be/…\"><\/div>\n        <label class=\"check field full\" style=\"flex-direction:row;display:flex\"><input type=\"checkbox\" required> I confirm this report is accurate and follows the sporting regulations.<\/label>\n      <\/div>\n      <button class=\"btn btn-red btn-full arrow\" style=\"margin-top:24px\" type=\"submit\">Submit to stewards<\/button>\n    <\/form>\n\n    <\!-- Decisions -->\n    <div id=\"decisions\">\n      <div class=\"sec-head\" style=\"margin-bottom:20px\"><div><div class=\"eyebrow\">Season 2<\/div><h2 style=\"font-size:36px\">Recent cases<\/h2><\/div><\/div>\n      <div class=\"filterbar\" id=\"sf\" style=\"margin-bottom:16px\">\n        <button class=\"chip on\" data-s=\"all\">All<\/button>\n        <button class=\"chip\" data-s=\"pending\">Pending<\/button>\n        <button class=\"chip\" data-s=\"review\">Under review<\/button>\n        <button class=\"chip\" data-s=\"penalty\">Penalty<\/button>\n        <button class=\"chip\" data-s=\"noaction\">No action<\/button>\n      <\/div>\n      <div id=\"cases\"><\/div>\n    <\/div>\n  <\/div>\n<\/div><\/section>\n\n<script src=\"site.js\"><\/script>\n<script>\n  const LABEL = { pending: 'Pending', review: 'Under review', penalty: 'Penalty', noaction: 'No further action' };\n  const opts = arr => arr.map(([v, l]) => `<option value=\"${v}\">${l}<\/option>`).join('');\n  const done = RACES.filter(r => r.status === 'done').reverse();\n  document.getElementById('f-round').innerHTML = opts(done.map(r => [r.r, `R${r.r} · ${r.name}`]));\n  const names = DRIVERS.map(d => [d.first + ' ' + d.last, `#${d.num} ${d.first} ${d.last}`]);\n  document.getElementById('f-by').innerHTML = opts(names);\n  document.getElementById('f-against').innerHTML = opts(names.slice(1).concat([names[0]]));\n\n  let filter = 'all';\n  const draw = () => {\n    document.getElementById('cases').innerHTML = COMPLAINTS.filter(c => filter === 'all' || c.status === filter).map(c => `\n      <div class=\"complaint\">\n        <div class=\"top\"><span class=\"id\">${c.id} · R${c.round} ${RACES[c.round - 1].name} · Lap ${c.lap}<\/span><span class=\"pill ${c.status}\">${LABEL[c.status]}<\/span><\/div>\n        <h4>${c.title}<\/h4>\n        <p><b>${c.by}<\/b> vs <b>${c.against}<\/b> — ${c.desc}<\/p>\n        <div class=\"att\">▶ ${c.files} clip${c.files > 1 ? 's' : ''} attached<\/div>\n        ${c.verdict ? `<div class=\"verdict\">Stewards: ${c.verdict}<\/div>` : ''}\n      <\/div>`).join('') || '<p>No cases with this status.<\/p>';\n  };\n  document.getElementById('sf').onclick = e => {\n    const b = e.target.closest('.chip'); if (!b) return;\n    document.querySelectorAll('#sf .chip').forEach(c => c.classList.toggle('on', c === b));\n    filter = b.dataset.s; draw();\n  };\n  draw();\n\n  // Drag & drop uploads (prototype: files are listed, not sent anywhere)\n  const drop = document.getElementById('drop'), input = document.getElementById('file'), list = document.getElementById('files');\n  let files = [];\n  const showFiles = () => list.innerHTML = files.map((f, i) =>\n    `<li><span>▶ ${f.name} · ${(f.size / 1048576).toFixed(1)} MB<\/span><button type=\"button\" data-i=\"${i}\">×<\/button><\/li>`).join('');\n  const add = fl => { files = files.concat([...fl]); showFiles(); };\n  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));\n  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));\n  drop.addEventListener('drop', e => add(e.dataTransfer.files));\n  input.addEventListener('change', () => add(input.files));\n  list.addEventListener('click', e => { if (e.target.dataset.i) { files.splice(+e.target.dataset.i, 1); showFiles(); } });\n\n  document.getElementById('form').addEventListener('submit', e => {\n    e.preventDefault();\n    const v = id => document.getElementById(id).value;\n    if (v('f-by') === v('f-against')) return toast('You cannot file a complaint against yourself.');\n    COMPLAINTS.unshift({\n      id: 'FZ-S2-0' + (42 + COMPLAINTS.length - 4), round: +v('f-round'), lap: v('f-lap'), status: 'pending',\n      by: v('f-by'), against: v('f-against'), title: v('f-type'), desc: v('f-desc'), verdict: null, files: Math.max(1, files.length),\n    });\n    filter = 'all'; document.querySelectorAll('#sf .chip').forEach((c, i) => c.classList.toggle('on', i === 0));\n    draw(); e.target.reset(); files = []; showFiles();\n    toast('Complaint submitted: the stewards will review it before the next round.');\n    document.getElementById('decisions').scrollIntoView({ behavior: 'smooth' });\n  });\n  if (__FZ.hash === '#decisions') document.getElementById('decisions').scrollIntoView();\n<\/script>\n<\/body>\n<\/html>\n"}}}; state.proto = "claude"; start();
</script>
